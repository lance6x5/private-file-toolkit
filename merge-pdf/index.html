<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- fw:head -->
  </head>
  <body data-page="merge-pdf">
    <!-- fw:header -->
    <main id="main" tabindex="-1">
      <!-- fw:intro -->
      <section class="tool card" aria-label="Merge PDF tool">
        <div class="dropzone" id="dz">
          <input id="file-input" class="visually-hidden" type="file" accept="application/pdf,.pdf" multiple />
          <label for="file-input" class="dz-label">
            <svg class="dz-icon" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" focusable="false"><path d="M12 15V4m0 0-4 4m4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="dz-title">Drop PDFs here, or <span class="dz-link">choose files</span></span>
            
            <span class="dz-limits"></span>
          </label>
        </div>
        <ol id="file-list" class="file-list" hidden aria-label="PDFs to merge, in order"></ol>
        <p id="hint" class="muted" hidden>Add at least one more PDF to merge.</p>
        <div class="actions">
          <button id="run-btn" class="btn btn-primary" type="button" disabled>Merge PDFs</button>
          <button id="clear-btn" class="btn btn-ghost" type="button" hidden>Clear</button>
        </div>
        <div class="progress" id="progress" hidden>
          <progress max="1" aria-label="Progress"></progress>
          <p class="progress-label" role="status" aria-live="polite"></p>
        </div>
        <div id="results" class="results" hidden></div>
      </section>
      <!-- fw:help -->

    </main>
    <!-- fw:footer -->
    <script type="module" src="/src/pages/merge.js"></script>
  </body>
</html>
